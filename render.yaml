services:
  - type: web
    name: elcara-backend
    runtime: node
    plan: free
    rootDir: backend
    # --include=dev: typescript + @types live in devDependencies, but the
    # service sets NODE_ENV=production, which makes npm omit them by default.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: BLOB_READ_WRITE_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: GEMINI_GENERATION_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-2
      - key: GENERATION_PROVIDER
        value: groq
      - key: GENERATION_FALLBACK_CHAIN
        value: groq,gemini
      - key: ALLOWED_ORIGINS
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_BASE_URL
        sync: false
