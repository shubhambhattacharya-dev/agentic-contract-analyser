name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start Redis
        run: |
          docker run -d --name ci-redis -p 6379:6379 redis:7-alpine \
            redis-server --requirepass devpassword --appendonly no

          for attempt in $(seq 1 30); do
            if docker exec ci-redis redis-cli -a devpassword ping 2>/dev/null | grep -q PONG; then
              echo "Redis is ready"
              exit 0
            fi
            sleep 1
          done

          echo "Redis did not become ready in time"
          docker logs ci-redis
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create test environment
        run: |
          cat > .env <<'EOF'
          NODE_ENV=test
          LOG_LEVEL=warn
          PORT=8000
          HOST=127.0.0.1
          GROQ_API_KEY=test-groq-key-ci
          GROQ_GENERATION_MODEL=openai/gpt-oss-120b
          GOOGLE_GENERATIVE_AI_API_KEY=test-gemini-key-ci
          GEMINI_GENERATION_MODEL=gemini-2.5-flash
          GEMINI_EMBEDDING_MODEL=gemini-embedding-2
          GENERATION_PROVIDER=groq
          EMBEDDING_PROVIDER=gemini
          GENERATION_FALLBACK_CHAIN=groq,gemini
          REDIS_HOST=127.0.0.1
          REDIS_PORT=6379
          REDIS_PASSWORD=devpassword
          MAX_FILE_BYTES=26214400
          EMBED_BATCH_SIZE=100
          MAX_AGENT_ROUNDS=4
          RETRIEVAL_TOP_K=15
          INGEST_MAX_DURATION=60
          LANGFUSE_LOG_CONTENT=false
          EOF

      - name: Secret scan
        run: |
          ! grep -rEn "(AIza[0-9A-Za-z_-]{20,}|gsk_[0-9A-Za-z]{20,}|sk-[0-9A-Za-z]{20,})"             src tests --include="*.ts"

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Build
        run: npm run build

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
