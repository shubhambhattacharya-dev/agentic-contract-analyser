# Local development only — never use this config in production

services:
  redis:
    image: redis:7-alpine
    container_name: elcara-redis

    ports:
      # Host port 6380 (not the conventional 6379): on this machine a
      # WSL-mode Redis races Docker for 127.0.0.1:6379, which silently
      # splits Elcara's data across two instances.
      - "127.0.0.1:6380:6379"

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-devpassword}

    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD:-devpassword}"
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru

    volumes:
      - redis_data:/data

    networks:
      - elcara-net

    deploy:
      resources:
        limits:
          memory: 256m

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-devpassword}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ─────────────────────────────────────────────────────────────────
  # LLM observability (self-hosted Langfuse, v2 = Postgres only).
  # Dashboard: http://localhost:3001 — sign up on first visit, create
  # project "Elcara", copy keys into backend/.env (LANGFUSE_*).
  # Bind to 127.0.0.1 only; session secrets below are local-dev values.
  # ─────────────────────────────────────────────────────────────────
  langfuse:
    image: langfuse/langfuse:2
    container_name: elcara-langfuse

    ports:
      - "127.0.0.1:3001:3000"

    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-elcara-local-nextauth-secret-change-me}
      SALT: ${LANGFUSE_SALT:-elcara-local-salt-change-me}
      TELEMETRY_ENABLED: "false"

    depends_on:
      langfuse-postgres:
        condition: service_healthy

    networks:
      - elcara-net

  langfuse-postgres:
    image: postgres:16-alpine
    container_name: elcara-langfuse-db

    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse

    volumes:
      - langfuse_db:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

    networks:
      - elcara-net

networks:
  elcara-net:
    driver: bridge

volumes:
  redis_data:
    driver: local

  langfuse_db:
    driver: local